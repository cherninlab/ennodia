name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag"
        type: choice
        required: true
        default: next
        options:
          - next
          - latest
      dry_run:
        description: "Run all gates but skip publication"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: |
          bun run release:check
          git diff --exit-code

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version} (expected ${expected_tag})."
            exit 1
          fi

      - name: Resolve release mode
        id: release_mode
        env:
          INPUT_DIST_TAG: ${{ github.event.inputs.dist_tag }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          dist_tag="${INPUT_DIST_TAG:-next}"
          dry_run="${INPUT_DRY_RUN:-false}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              dist_tag="next"
            else
              dist_tag="latest"
            fi
            dry_run="false"
          fi

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"

      - name: Dry-run publish core to npm
        if: steps.release_mode.outputs.dry_run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --tag "${{ steps.release_mode.outputs.dist_tag }}"

      - name: Dry-run publish IO to npm
        if: steps.release_mode.outputs.dry_run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/ennodia-io
        run: npm publish --dry-run --tag "${{ steps.release_mode.outputs.dist_tag }}"

      - name: Dry-run publish to JSR
        if: steps.release_mode.outputs.dry_run == 'true'
        run: npx jsr publish --dry-run

      - name: Verify npm authentication
        if: steps.release_mode.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Publish core to npm
        if: steps.release_mode.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists; ensuring the ${{ steps.release_mode.outputs.dist_tag }} dist-tag."
            npm dist-tag add "${package_name}@${package_version}" "${{ steps.release_mode.outputs.dist_tag }}"
          else
            npm publish --tag "${{ steps.release_mode.outputs.dist_tag }}"
          fi

      - name: Publish to JSR
        if: steps.release_mode.outputs.dry_run != 'true'
        run: npx jsr publish

      - name: Publish IO to npm
        if: steps.release_mode.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/ennodia-io
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists; ensuring the ${{ steps.release_mode.outputs.dist_tag }} dist-tag."
            npm dist-tag add "${package_name}@${package_version}" "${{ steps.release_mode.outputs.dist_tag }}"
          else
            npm publish --tag "${{ steps.release_mode.outputs.dist_tag }}"
          fi

      - name: Install MCP publisher
        if: steps.release_mode.outputs.dry_run != 'true'
        run: |
          publisher_version="1.8.1"
          publisher_archive="mcp-publisher_linux_amd64.tar.gz"
          publisher_url="https://github.com/modelcontextprotocol/registry/releases/download/v${publisher_version}/${publisher_archive}"

          curl -fsSLo "${publisher_archive}" "${publisher_url}"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${publisher_archive}" | sha256sum --check
          tar xzf "${publisher_archive}" mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher

      - name: Publish to MCP Registry
        if: steps.release_mode.outputs.dry_run != 'true'
        run: |
          server_name="$(node -p "encodeURIComponent(JSON.parse(require('fs').readFileSync('server.json', 'utf8')).name)")"
          server_version="$(node -p "encodeURIComponent(JSON.parse(require('fs').readFileSync('server.json', 'utf8')).version)")"
          registry_url="https://registry.modelcontextprotocol.io"
          version_url="${registry_url}/v0.1/servers/${server_name}/versions/${server_version}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${version_url}")"

          case "${status}" in
            200)
              echo "${server_name}@${server_version} is already in the MCP Registry; skipping publish."
              ;;
            404)
              mcp-publisher login github-oidc --registry="${registry_url}"
              mcp-publisher publish server.json
              ;;
            *)
              echo "MCP Registry existence check returned HTTP ${status}."
              exit 1
              ;;
          esac

      - name: Pack release artifact
        if: steps.release_mode.outputs.dry_run != 'true'
        run: npm pack

      - name: Create GitHub release
        if: steps.release_mode.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: "*.tgz"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
