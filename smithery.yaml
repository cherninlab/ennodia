startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'ennodia'],
      env: config.tools === 'all' ? { ENNODIA_TOOLS: 'all' } : {}
    })

configSchema:
  type: object
  properties:
    tools:
      type: string
      enum: ["core", "all"]
      default: "core"
      description: "core loads the six tools for handing work to agents. all loads every Ennodia tool, which adds about 9,000 tokens of tool definitions to each session."
